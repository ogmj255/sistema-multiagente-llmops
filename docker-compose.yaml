services:
  postgres:
    image: postgres:16-alpine
    container_name: clausulas-postgres
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  chroma:
    image: chromadb/chroma:1.5.9
    container_name: clausulas-chroma
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: clausulas-backend:0.1
    container_name: clausulas-backend
    env_file:
      - ./backend/.env
    environment:
      CHROMA_HOST: chroma
      EXPERIMENT_DATA_DIR: /app/data/evaluation
      EXPERIMENT_ADMIN_TOKEN: ${EXPERIMENT_ADMIN_TOKEN:-}
      EXPERIMENT_OPERATOR_PASSWORD: ${EXPERIMENT_OPERATOR_PASSWORD:-}
      EXPERIMENT_EXECUTION_ENABLED: ${EXPERIMENT_EXECUTION_ENABLED:-false}
      EXPERIMENT_MAX_REPORTED_COST_USD: ${EXPERIMENT_MAX_REPORTED_COST_USD:-0.10}
      CHROMA_PORT: 8000
      CHROMA_COLLECTION: legal_knowledge
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen3:4b
      OLLAMA_EMBEDDING_MODEL: qwen3-embedding:0.6b
      OLLAMA_EMBEDDING_DIMENSIONS: 1024
    volumes:
      - ./data/evaluation:/app/data/evaluation
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.routers.backend.priority=100"
      - "traefik.http.routers.backend.middlewares=backend-strip-prefix"
      - "traefik.http.middlewares.backend-strip-prefix.stripprefix.prefixes=/api"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"

  evaluation-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: clausulas-backend:0.1
    container_name: clausulas-evaluation-worker
    env_file:
      - ./backend/.env
    environment:
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      CHROMA_COLLECTION: legal_knowledge
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen3:4b
      OLLAMA_EMBEDDING_MODEL: qwen3-embedding:0.6b
      OLLAMA_EMBEDDING_DIMENSIONS: 1024
      EXPERIMENT_DATA_DIR: /app/data/evaluation
      PYTHONPATH: /app
      EXPERIMENT_ADMIN_TOKEN: ${EXPERIMENT_ADMIN_TOKEN:-}
      EXPERIMENT_EXECUTION_ENABLED: ${EXPERIMENT_EXECUTION_ENABLED:-false}
      EXPERIMENT_MAX_REPORTED_COST_USD: ${EXPERIMENT_MAX_REPORTED_COST_USD:-0.10}
    volumes:
      - ./data/evaluation:/app/data/evaluation
      - ./scripts:/app/scripts:ro
    command: ["python", "-m", "scripts.evaluation_worker"]
    profiles:
      - experiment
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: clausulas-frontend:0.1
    container_name: clausulas-frontend
    environment:
      EXPERIMENT_ADMIN_TOKEN: ${EXPERIMENT_ADMIN_TOKEN:-}
      API_EXPERIMENT_URL: http://traefik/api/experimental
    expose:
      - "8501"
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=8501"

  traefik:
    image: traefik:v3.7
    container_name: clausulas-traefik
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro"

volumes:
  postgres_data:
  chroma_data:
